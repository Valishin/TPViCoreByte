# TPV Hostelería — producción en el mini PC (Debian 13, linux/amd64).
#
# El instalador lo copia a /opt/tpv/compose.yaml junto al .env de la
# instalación; las impresoras USB van en compose.override.yaml (lo genera el
# instalador con los dispositivos de cada local). Desde /opt/tpv:
#
#   docker compose up -d          docker compose ps          docker compose logs -f app
#
# Un solo puerto (80): FrankenPHP sirve la app y pasa /app y /apps a Reverb
# (websockets). Sin Vite: los assets van compilados dentro de la imagen.

x-logging: &logging
    driver: local            # comprimido y con rotación
    options:
        max-size: '10m'
        max-file: '3'

x-app: &app
    image: '${TPV_IMAGE:-ghcr.io/CAMBIAR/tpv-hosteleria}:${TPV_VERSION:-latest}'
    restart: unless-stopped
    env_file: .env
    logging: *logging
    volumes:
        - 'storage:/app/storage/app'   # logo, impresiones simuladas, exportaciones
        - 'backups:/backups'           # copias cifradas (rotación local)
        # Clave de Tailscale para el servicio del equipo (700, usuario de la app; ver TailscaleBridge).
        - '/opt/tpv/host/tailscale:/var/tpv/host/tailscale'
    networks: [tpv]
    depends_on:
        pgsql:
            condition: service_healthy

# Los workers solo comprueban que su proceso sigue vivo.
x-worker-health: &worker-health
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
    app:
        <<: *app
        ports:
            - '${APP_HTTP_PORT:-80}:80'
        mem_limit: 768m
        healthcheck:
            test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost/api/health']
            interval: 15s
            timeout: 5s
            retries: 4
            start_period: 40s

    reverb:
        <<: *app
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        mem_limit: 384m
        healthcheck:
            # Cualquier respuesta HTTP vale: el servidor de websockets está escuchando.
            test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8080/ || exit 1']
            <<: *worker-health

    queue:
        <<: *app
        # default + email (facturas en PDF; cada job fija sus reintentos)
        command: ['php', 'artisan', 'queue:work', '--queue=default,email,verifactu', '--sleep=1', '--tries=3', '--timeout=90', '--max-time=3600']
        mem_limit: 384m
        healthcheck:
            test: ['CMD', 'pgrep', '-f', 'queue:work']
            <<: *worker-health

    # Impresión (comandas, tickets, cajón, informes). Las impresoras USB se le
    # pasan en compose.override.yaml (devices + group_add del grupo lp).
    printing:
        <<: *app
        command: ['php', 'artisan', 'queue:work', '--queue=printing', '--sleep=1', '--timeout=30', '--max-time=3600']
        mem_limit: 384m
        healthcheck:
            test: ['CMD', 'pgrep', '-f', 'queue:work']
            <<: *worker-health

    # Tareas programadas: copias de seguridad, avisos…
    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        mem_limit: 256m
        healthcheck:
            test: ['CMD', 'pgrep', '-f', 'schedule:work']
            <<: *worker-health

    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        logging: *logging
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
            TZ: 'Europe/Madrid'
        # Ajuste para un mini PC de 8-16 GB con un solo local.
        command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'effective_cache_size=1GB', '-c', 'work_mem=8MB', '-c', 'max_connections=50']
        shm_size: 128m
        mem_limit: 1g
        volumes:
            - 'pgsql:/var/lib/postgresql'
        networks: [tpv]
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

networks:
    tpv:
        driver: bridge

volumes:
    pgsql:
    storage:
    backups:
